spring.application.name=reelvault-api
spring.datasource.url=${REELVAULT_DATABASE_URL:jdbc:sqlite:./data/reelvault.db}
spring.datasource.driver-class-name=${REELVAULT_DATABASE_DRIVER:org.sqlite.JDBC}
spring.jpa.database-platform=${REELVAULT_HIBERNATE_DIALECT:org.hibernate.community.dialect.SQLiteDialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
server.error.include-message=never
server.port=8081
reelvault.cors.allowed-origins=${REELVAULT_CORS_ORIGINS:http://localhost:3000}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${REELVAULT_COOKIE_SECURE:false}
